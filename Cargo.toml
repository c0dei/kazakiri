[workspace]
resolver = "2"
members = ["crates/kazakiri-core", "crates/kazakiri-cli", "crates/kazakiri-win"]

[workspace.package]
version = "0.12.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
memmap2 = "0.9.12"
encoding_rs = "0.8.44"
memchr = "2.8.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 1
